server:
  port: 8080
spring:
  datasource:
    url: jdbc:postgresql://${PG_HOST:localhost}:5432/${PG_DB:rag_platform}
    username: ${PG_USER:rag}
    password: ${PG_PASSWORD:rag123456}
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 60MB
management:
  endpoints:
    web:
      exposure:
        include: health,info
dashscope:
  api-key: ${DASHSCOPE_API_KEY:}
  base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
  chat-model: qwen-plus
  embedding-model: text-embedding-v4
  embedding-dimensions: 1024
  rerank-model: qwen3-rerank
  rerank-base-url: ${DASHSCOPE_RERANK_BASE_URL:https://dashscope.aliyuncs.com}
rag:
  retrieval:
    query-rewrite-enabled: ${RAG_QUERY_REWRITE_ENABLED:true}
    rerank-enabled: ${RAG_RERANK_ENABLED:true}
    max-rewrites: ${RAG_MAX_REWRITES:3}
    dense-limit: ${RAG_DENSE_LIMIT:40}
    keyword-limit: ${RAG_KEYWORD_LIMIT:40}
    candidate-limit: ${RAG_CANDIDATE_LIMIT:40}
    context-limit: ${RAG_CONTEXT_LIMIT:8}
    rrf-constant: ${RAG_RRF_CONSTANT:60}
qdrant:
  host: ${QDRANT_HOST:localhost}
  port: ${QDRANT_PORT:6333}
  collection: kb_embeddings
  score-threshold: ${QDRANT_SCORE_THRESHOLD:0.20}
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: rag-docs
security:
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-key-please-32chars}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
