server:
  port: 8080
spring:
  datasource:
    url: jdbc:postgresql://${PG_HOST:localhost}:5432/${PG_DB:rag_platform}
    username: ${PG_USER:rag}
    password: ${PG_PASSWORD:rag123456}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 60MB
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-not-delete-value: false
      logic-delete-value: true
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
dashscope:
  api-key: ${DASHSCOPE_API_KEY:}
  base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
  chat-model: qwen-plus
  embedding-model: text-embedding-v4
  embedding-dimensions: 1024
  rerank-model: qwen3-rerank
  rerank-base-url: ${DASHSCOPE_RERANK_BASE_URL:https://dashscope.aliyuncs.com}
rag:
  tokenizer:
    # Offline tokenizer.json shipped with the BGE-M3 embedding model.
    path: ${RAG_TOKENIZER_PATH:/models/bge‑m3‑tokenizer/tokenizer.json}
  sse:
    timeout-seconds: ${RAG_SSE_TIMEOUT:120}
    history-message-count: ${RAG_HISTORY_MESSAGES:8}
    max-citations: ${RAG_MAX_CITATIONS:3}
  retrieval:
    query-rewrite-enabled: ${RAG_QUERY_REWRITE_ENABLED:true}
    rerank-enabled: ${RAG_RERANK_ENABLED:true}
    max-rewrites: ${RAG_MAX_REWRITES:3}
    dense-limit: ${RAG_DENSE_LIMIT:50}
    keyword-limit: ${RAG_KEYWORD_LIMIT:50}
    candidate-limit: ${RAG_CANDIDATE_LIMIT:50}
    context-limit: ${RAG_CONTEXT_LIMIT:5}
    rrf-constant: ${RAG_RRF_CONSTANT:60}
  index-task:
    initial-delay-ms: ${RAG_INDEX_TASK_INITIAL_DELAY_MS:15000}
    poll-ms: ${RAG_INDEX_TASK_POLL_MS:30000}
  document-scan:
    initial-delay-ms: ${RAG_DOCUMENT_SCAN_INITIAL_DELAY_MS:30000}
    poll-ms: ${RAG_DOCUMENT_SCAN_POLL_MS:60000}
  quality-monitor:
    initial-delay-ms: ${RAG_QUALITY_MONITOR_INITIAL_DELAY_MS:60000}
    poll-ms: ${RAG_QUALITY_MONITOR_POLL_MS:300000}
  observability:
    environment: ${RAG_OBSERVABILITY_ENVIRONMENT:local}
    langfuse:
      enabled: ${LANGFUSE_ENABLED:false}
      host: ${LANGFUSE_HOST:https://cloud.langfuse.com}
      public-key: ${LANGFUSE_PUBLIC_KEY:}
      secret-key: ${LANGFUSE_SECRET_KEY:}
  evaluation:
    enabled: ${RAG_EVALUATION_ENABLED:false}
    endpoint: ${RAGAS_ENDPOINT:http://ragas:8095}
    optimizer-enabled: ${GEPA_ENABLED:false}
    optimizer-endpoint: ${GEPA_ENDPOINT:http://gepa:8096}
    poll-ms: ${RAG_EVALUATION_POLL_MS:60000}
docling:
  enabled: ${DOCLING_ENABLED:false}
  endpoint: ${DOCLING_ENDPOINT:http://localhost:8090}
  timeout-seconds: ${DOCLING_TIMEOUT_SECONDS:180}
  max-bytes: ${DOCLING_MAX_BYTES:52428800}
  sample-pages: ${DOCLING_SAMPLE_PAGES:8}
  sample-rows: ${DOCLING_SAMPLE_ROWS:200}
  fallback-to-tika: ${DOCLING_FALLBACK_TO_TIKA:true}
paddleocr:
  enabled: ${PADDLEOCR_ENABLED:true}
  endpoint: ${PADDLEOCR_ENDPOINT:http://localhost:8091}
  timeout-seconds: ${PADDLEOCR_TIMEOUT_SECONDS:180}
milvus:
  host: ${MILVUS_HOST:localhost}
  port: ${MILVUS_PORT:19530}
  token: ${MILVUS_TOKEN:}
  collection: ${MILVUS_COLLECTION:kb_embeddings_hybrid}
  dimension: ${MILVUS_DIMENSION:1024}
  score-threshold: ${MILVUS_SCORE_THRESHOLD:0.20}
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: rag-docs
security:
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-key-please-32chars}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
