services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_DB: rag_platform, POSTGRES_USER: rag, POSTGRES_PASSWORD: rag123456 }
    volumes: [ pgdata:/var/lib/postgresql/data, ./docs/init.sql:/docker-entrypoint-initdb.d/init.sql:ro ]
    ports: [ "5432:5432" ]
    healthcheck: { test: [ "CMD-SHELL", "pg_isready -U rag" ], interval: 5s, timeout: 3s, retries: 10 }
  qdrant:
    image: qdrant/qdrant:latest
    volumes: [ qdrantdata:/qdrant/storage ]
    ports: [ "6333:6333", "6334:6334" ]
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: minioadmin, MINIO_ROOT_PASSWORD: minioadmin }
    volumes: [ miniodata:/data ]
    ports: [ "9000:9000", "9001:9001" ]
  backend:
    build: ./backend
    environment:
      PG_HOST: postgres
      DASHSCOPE_API_KEY: "${DASHSCOPE_API_KEY:-}"
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      QDRANT_SCORE_THRESHOLD: "${QDRANT_SCORE_THRESHOLD:-0.20}"
      RAG_QUERY_REWRITE_ENABLED: "${RAG_QUERY_REWRITE_ENABLED:-true}"
      RAG_RERANK_ENABLED: "${RAG_RERANK_ENABLED:-true}"
      RAG_MAX_REWRITES: "${RAG_MAX_REWRITES:-3}"
      RAG_DENSE_LIMIT: "${RAG_DENSE_LIMIT:-40}"
      RAG_KEYWORD_LIMIT: "${RAG_KEYWORD_LIMIT:-40}"
      RAG_CANDIDATE_LIMIT: "${RAG_CANDIDATE_LIMIT:-40}"
      RAG_CONTEXT_LIMIT: "${RAG_CONTEXT_LIMIT:-8}"
      RAG_RRF_CONSTANT: "${RAG_RRF_CONSTANT:-60}"
      MINIO_ENDPOINT: "http://minio:9000"
    depends_on:
      postgres: { condition: service_healthy }
      qdrant: { condition: service_started }
      minio: { condition: service_started }
    ports: [ "8080:8080" ]
  frontend:
    build: ./frontend
    depends_on: [ backend ]
    ports: [ "80:80" ]
volumes: { pgdata: { }, qdrantdata: { }, miniodata: { } }
